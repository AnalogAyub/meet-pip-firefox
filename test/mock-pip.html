<!doctype html>
<html><head><meta charset="utf-8"><title>Mock PiP window</title>
<!-- A stand-in for Firefox's PiP player window with the Sine mod's bar on it,
     for checking sine-mod/player.css without Zen. The video is the composite
     from mock-meet.html, loaded in a hidden frame. The bar's markup mirrors
     what sine-mod/meet-pip.uc.js builds; the buttons here do nothing.
     ?micoff and ?camoff show the off states; ?scale=1.5 enlarges the window. -->
<link rel="stylesheet" href="../sine-mod/player.css">
<style>
  body { margin: 0; background: #e8eaed; font-family: system-ui, sans-serif; }
  #frame { position: fixed; left: 0; top: 0; width: 900px; height: 700px; opacity: 0; pointer-events: none; border: 0; }
  #window { position: absolute; left: 24px; top: 24px; width: 379px; background: #131314; border-radius: 19px;
            overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); transform-origin: 0 0; }
  #window video { display: block; width: 100%; }
  #meetpip-bar { opacity: 1 !important; }
</style></head>
<body>
<iframe id="frame"></iframe>
<div id="window">
  <video autoplay muted playsinline></video>
  <div id="meetpip-bar">
    <div class="row reactions">
      <button class="react">💖</button><button class="react">👍</button><button class="react">🎉</button><button class="react">👏</button><button class="react">😂</button><button class="react">😮</button>
      <span class="more"><button class="react">＋</button><input class="emoji"></span>
    </div>
    <div class="row">
      <button id="mic"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
      <button id="cam"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg></button>
      <input type="text" placeholder="Message everyone">
      <button class="end"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const win = document.getElementById('window'), frame = document.getElementById('frame');
  win.style.transform = `scale(${+q.get('scale') || 1})`;
  const OFF = { mic: 'M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z', cam: 'M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z' };
  for (const id of ['mic', 'cam']) {
    if (!q.has(id + 'off')) continue;
    const b = document.getElementById(id);
    b.setAttribute('off', '');
    b.querySelector('path').setAttribute('d', OFF[id]);
  }
  // Everything but this page's own options goes on to the mock call.
  const pass = new URLSearchParams(q);
  for (const k of ['scale', 'micoff', 'camoff']) pass.delete(k);
  if (!pass.has('n')) pass.set('n', '3');
  pass.set('focus', '');
  if (q.has('micoff')) pass.set('muted', '');
  frame.src = 'mock-meet.html?' + pass;
  const timer = setInterval(() => {
    const doc = frame.contentDocument, mirror = doc?.getElementById('meet-pip-mirror');
    if (!mirror?.srcObject) return;
    clearInterval(timer);
    win.querySelector('video').srcObject = mirror.srcObject;
    // What the mod sends, so tile corners follow this window's.
    setInterval(() => doc.dispatchEvent(new CustomEvent('meet-pip-command', { detail: JSON.stringify({ cmd: 'window', width: 379 }) })), 1000);
    if (q.has('micoff')) setTimeout(() => doc.querySelector('#bar button[data-is-muted]').click(), 500);
    if (q.has('camoff')) setTimeout(() => doc.querySelectorAll('#bar button[data-is-muted]')[1].click(), 500);
  }, 200);
</script>
</body></html>
