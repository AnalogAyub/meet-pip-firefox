<!doctype html>
<!-- Fake Meet call for testing content.js. Serve the repo root and open
     /test/mock-meet.html. ?present adds a screenshare, ?focus fakes page focus, ?shot shows only
     the composite.
     window.sim() fires a chat announcement, UI noise and three reactions. -->
<html><head><meta charset="utf-8"><title>Mock Meet</title>
<link rel="stylesheet" href="../content.css">
<style>
  body { margin:0; background:#202124; font-family: system-ui; color:#fff; }
  #stage { display:grid; grid-template-columns: 2fr 1fr; gap:8px; padding:16px; height: 70vh; }
  .tile { position:relative; background:#3c4043; border-radius:8px; overflow:hidden; }
  .tile video { width:100%; height:100%; object-fit:cover; }
  .self video { transform: scaleX(-1); }
  #bar { position:fixed; bottom:0; left:0; right:0; height:80px; display:flex; justify-content:center; align-items:center; background:#000; }
  #cluster { display:flex; gap:8px; align-items:center; }
  .pair { display:flex; background:#333; border-radius:24px; }
  #bar button { width:48px; height:48px; border-radius:24px; border:0; }
  #bar button[data-is-muted="true"] { background:#d93025; color:#fff; }
</style></head>
<body>
<div id="stage">
  <div class="tile" data-participant-id="p1" style="grid-row: span 3"><video autoplay muted playsinline></video><button aria-label="Pin Alice to your screen"></button></div>
  <div class="tile" data-participant-id="p2"><video autoplay muted playsinline></video></div>
  <div class="tile" data-participant-id="p3"><video autoplay muted playsinline></video></div>
  <div class="tile self" data-participant-id="p4"><video autoplay muted playsinline></video></div>
</div>
<div id="live" aria-live="polite" style="position:absolute;left:-999px"></div>
<div style="display:none"><div data-sender-name="Bob Builder"><div data-message-id="m1">Can everyone see the deck? I will drop the link in here in a second so you can follow along with the numbers</div></div></div>
<div id="bar"><div id="cluster">
  <div class="pair"><button aria-label="Audio settings">^</button><button data-is-muted="false" aria-label="Turn off microphone (⌘+d)">mic</button></div>
  <div class="pair"><button aria-label="Video settings">^</button><button data-is-muted="false" aria-label="Turn off camera (⌘+e)">cam</button></div>
  <button>a</button><button>b</button><button>c</button><button>d</button>
  <button aria-label="Leave call">x</button>
</div></div>
<script>
  const q = new URLSearchParams(location.search), present = q.has('present');
  // ?n=9: that many other participants instead of 3.
  if (q.has('n')) document.querySelectorAll('.tile:not(.self)').forEach((t, k) => { if (k >= +q.get('n')) t.remove(); });
  for (let k = 4; k <= +q.get('n'); k++) {
    document.querySelector('.tile.self').insertAdjacentHTML('beforebegin', `<div class="tile" data-participant-id="x${k}"><video autoplay muted playsinline></video></div>`);
  }
  document.querySelectorAll('.tile').forEach((tile, i) => {
    const c = document.createElement('canvas'); c.width = i === 0 && present ? 1600 : 640; c.height = i === 0 && present ? 900 : 360;
    const x = c.getContext('2d'); let t = 0; const hue = i * 90;
    (function draw() {
      t++;
      if (i === 0 && present) {
        // A slide: title, bullets and a bar chart.
        x.fillStyle = '#f8f9fa'; x.fillRect(0, 0, c.width, c.height);
        x.fillStyle = '#1a73e8'; x.fillRect(0, 0, c.width, 14);
        x.fillStyle = '#202124'; x.font = '600 72px sans-serif'; x.fillText('Quarterly review', 110, 170);
        x.fillStyle = '#5f6368'; x.font = '40px sans-serif';
        ['Traffic up 12% over last quarter', 'Three launches shipped', 'Next: onboarding rework'].forEach((s, k) => x.fillText('•  ' + s, 120, 290 + k * 80));
        [0.45, 0.6, 0.52, 0.8, 0.95].forEach((h, k) => { x.fillStyle = k === 4 ? '#1a73e8' : '#c6dafc'; x.fillRect(980 + k * 100, 780 - h * 420, 70, h * 420); });
      } else {
        // A person: backdrop, shoulders and a head that sways a little.
        const g = x.createLinearGradient(0, 0, c.width, c.height);
        g.addColorStop(0, `hsl(${hue + 200},35%,42%)`); g.addColorStop(1, `hsl(${hue + 240},35%,22%)`);
        x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
        const cx = c.width / 2 + Math.sin(t / 40 + i) * 10;
        x.fillStyle = `hsl(${hue + 20},45%,30%)`; x.beginPath(); x.ellipse(cx, c.height * 1.08, c.height * 0.52, c.height * 0.42, 0, 0, 7); x.fill();
        x.fillStyle = `hsl(${28 + i * 4},45%,${62 + i * 5}%)`; x.beginPath(); x.arc(cx, c.height * 0.45, c.height * 0.2, 0, 7); x.fill();
      }
      requestAnimationFrame(draw);
    })();
    const v = tile.querySelector('video'); if (i === 0 && present) v.style.objectFit = 'contain';
    v.srcObject = c.captureStream(30);
  });
  document.querySelectorAll('#bar button[data-is-muted]').forEach(b => b.addEventListener('click', () => {
    b.dataset.isMuted = b.dataset.isMuted === 'true' ? 'false' : 'true';
  }));
  window.sim = () => {
    const l = document.getElementById('live');
    for (const text of ['Carla says: looks great', 'The presentation by Alice was added to the main screen.', 'Loading...', '35 results.', 'Dana Lee joined', 'Dana Lee has left the meeting', 'Dana Lee has started transcription', 'Transcription has started', 'Weekly sync panel is open', 'You reacted with 👍.']) {
      const d = document.createElement('div'); d.textContent = text; l.append(d);
    }
    // As Meet does: a wrapper, then its emoji child, plus the announcement above.
    // A chat announcement as Meet sends it: sender, time and text as separate
    // nodes, with the same message in the chat panel.
    setTimeout(() => {
      for (const text of ['Victoria Winters', '10:57 AM', 'All should just be called that going forward']) {
        const d = document.createElement('div'); d.textContent = text; l.append(d);
      }
      document.querySelector('[data-sender-name]').insertAdjacentHTML('afterend', '<div data-sender-name="Victoria Winters"><div data-message-id="m2">All should just be called that going forward</div></div>');
    }, 400);
    for (const e of ['👍','🎉','💖']) { const r = document.createElement('div'); document.body.append(r); r.innerHTML = '<span><img alt="'+e+'"></span>'; }
  };
  // Time spent in content.js's frame callback.
  window.perfStats = { ms: 0, n: 0, since: performance.now() };
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => raf(t => {
    if (cb.name !== 'tick') return cb(t);
    const a = performance.now(); cb(t); perfStats.ms += performance.now() - a; perfStats.n++;
  });
  if (q.has('focus')) document.hasFocus = () => true;
  document.write('<script src="' + (q.get('script') || '../content.js') + '"><\/script>');
  // ?shot: show only the composite, full window, for screenshots.
  if (q.has('shot') && q.has('wait')) document.write('<img src="/slow" hidden>');
  if (q.has('shot')) addEventListener('DOMContentLoaded', () => {
    const style = document.createElement('style');
    style.textContent = '#meet-pip-mirror{position:fixed!important;inset:0;width:100vw!important;height:100vh!important;z-index:2147483647;background:#131314;opacity:1!important}#meet-pip-dock{display:none}';
    document.head.append(style);
    if (q.has('muted')) setTimeout(() => document.querySelector('#bar button[data-is-muted]').click(), 300);
    setTimeout(sim, 2600);
  });
</script>
</body></html>
